<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Quatre façons de déployer sur Kubernetes convergent toutes vers l'apiserver : manifeste YAML, Kustomize, Helm, Terraform" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Manifeste YAML, Kustomize, Helm, Terraform : tous convergent vers l'apiserver</title>

  <defs>
    <marker id="dArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <g id="icoFileD" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5,2 H12 L16,6 V18 H5 Z"/>
      <path d="M12,2 V6 H16"/>
      <line x1="7.5" y1="10" x2="13.5" y2="10"/>
      <line x1="7.5" y1="13" x2="13.5" y2="13"/>
      <line x1="7.5" y1="16" x2="11" y2="16"/>
    </g>
    <g id="icoCloudD" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5,19 H9 a7,7 0 1,1 6.71,-9 h1.79 a4.5,4.5 0 1,1 0,9 z"/>
    </g>
    <g id="icoGearD" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="4.2"/>
      <line x1="14.2" y1="10" x2="18" y2="10"/>
      <line x1="12.1" y1="13.65" x2="14" y2="16.93"/>
      <line x1="7.9" y1="13.65" x2="6" y2="16.93"/>
      <line x1="5.8" y1="10" x2="2" y2="10"/>
      <line x1="7.9" y1="6.35" x2="6" y2="3.07"/>
      <line x1="12.1" y1="6.35" x2="14" y2="3.07"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="340" fill="#ffffff"/>

  <!-- Source 1: manifeste YAML -->
  <rect x="20" y="15" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <use href="#icoFileD" transform="translate(32,25) scale(0.85)" stroke="#1E3A8A"/>
  <text x="140" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Manifeste YAML</text>
  <text x="140" y="58" text-anchor="middle" font-size="9" fill="#1E3A8A">apiVersion / kind / spec</text>

  <!-- Source 2: Kustomize -->
  <rect x="20" y="95" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <use href="#icoFileD" transform="translate(32,105) scale(0.85)" stroke="#1E3A8A"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Kustomize</text>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#1E3A8A">base + overlays/patches</text>

  <!-- Source 3: Helm Chart -->
  <rect x="20" y="175" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <use href="#icoFileD" transform="translate(32,185) scale(0.85)" stroke="#1E3A8A"/>
  <text x="140" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Helm Chart</text>
  <text x="140" y="218" text-anchor="middle" font-size="9" fill="#1E3A8A">templates/ + values.yaml</text>

  <!-- Source 4: Terraform -->
  <rect x="20" y="255" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <use href="#icoCloudD" transform="translate(32,265) scale(0.8)" stroke="#1E3A8A"/>
  <text x="140" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Terraform (.tf)</text>
  <text x="140" y="298" text-anchor="middle" font-size="9" fill="#1E3A8A">provider kubernetes / helm</text>

  <!-- Arrows into hub, each at its own y -->
  <line x1="240" y1="45" x2="618" y2="45" stroke="#374151" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <text x="429" y="38" text-anchor="middle" font-size="9.5" fill="#374151">kubectl apply -f</text>

  <line x1="240" y1="125" x2="618" y2="125" stroke="#374151" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <text x="429" y="118" text-anchor="middle" font-size="9.5" fill="#374151">kubectl apply -k</text>

  <line x1="240" y1="205" x2="618" y2="205" stroke="#374151" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <text x="429" y="198" text-anchor="middle" font-size="9.5" fill="#374151">helm install / upgrade</text>

  <line x1="240" y1="285" x2="618" y2="285" stroke="#374151" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <text x="429" y="278" text-anchor="middle" font-size="9.5" fill="#374151">terraform apply</text>

  <!-- Hub: apiserver -->
  <rect x="620" y="10" width="240" height="320" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <use href="#icoGearD" transform="translate(720,124) scale(1.3)" stroke="#1E3A8A"/>
  <text x="740" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">kube-apiserver</text>
  <text x="740" y="204" text-anchor="middle" font-size="10" fill="#3B5FA0">seul point d'entrée pour créer</text>
  <text x="740" y="218" text-anchor="middle" font-size="10" fill="#3B5FA0">ou modifier des ressources K8s</text>
</svg>
