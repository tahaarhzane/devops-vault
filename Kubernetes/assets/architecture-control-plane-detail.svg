<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="Détail des interactions à l'intérieur du control plane" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Control plane : ce que fait chaque composant via l'apiserver</title>

  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowDBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <!-- Note explicative -->
  <text x="430" y="24" text-anchor="middle" font-size="11.5" fill="#6B7280">Aucun de ces composants ne se parle directement : tout passe par l'apiserver.</text>

  <!-- Actor boxes -->
  <rect x="190" y="40" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#1E3A8A">kube-scheduler</text>

  <rect x="345" y="40" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="73" text-anchor="middle" font-size="12" fill="#1E3A8A">kube-controller-manager</text>

  <rect x="570" y="40" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="680" y="73" text-anchor="middle" font-size="12" fill="#1E3A8A">cloud-controller-manager</text>

  <!-- Vertical arrows into apiserver, each individually labeled -->
  <line x1="260" y1="96" x2="260" y2="276" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="270" y="182" font-size="10" fill="#374151">assigne les pods</text>
  <text x="270" y="195" font-size="10" fill="#374151">Pending à un nœud</text>

  <line x1="450" y1="96" x2="450" y2="276" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="460" y="182" font-size="10" fill="#374151">réconcilie l'état</text>
  <text x="460" y="195" font-size="10" fill="#374151">réel ↔ désiré</text>

  <line x1="680" y1="96" x2="680" y2="276" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <text x="690" y="182" font-size="10" fill="#374151">provisionne LB /</text>
  <text x="690" y="195" font-size="10" fill="#374151">volumes cloud</text>

  <!-- apiserver hub -->
  <rect x="150" y="276" width="560" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="430" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">kube-apiserver</text>
  <text x="430" y="322" text-anchor="middle" font-size="10.5" fill="#3B5FA0">seule porte d'entrée : reçoit toutes les requêtes, expose l'API REST</text>

  <!-- apiserver <-> etcd -->
  <line x1="430" y1="344" x2="430" y2="404" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrowDBlue)" marker-start="url(#arrowDBlue)"/>
  <text x="445" y="368" font-size="10.5" fill="#1E3A8A">seule connexion</text>
  <text x="445" y="381" font-size="10.5" fill="#1E3A8A">d'etcd : lit / écrit</text>
  <text x="445" y="394" font-size="10.5" fill="#1E3A8A">l'état du cluster</text>

  <!-- etcd -->
  <rect x="350" y="404" width="160" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="430" y="429" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">etcd</text>
  <text x="430" y="444" text-anchor="middle" font-size="9.5" fill="#1E3A8A">source de vérité</text>
</svg>
