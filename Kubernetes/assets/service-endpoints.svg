<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Un client accède à un Service qui route vers trois pods backend" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Service ClusterIP routant vers trois pods via selector</title>

  <defs>
    <marker id="svcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="260" fill="#ffffff"/>

  <text x="444" y="18" text-anchor="middle" font-size="9" fill="#1E3A8A">selector: app=api</text>

  <!-- Client -->
  <rect x="15" y="95" width="150" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="90" y="120" text-anchor="middle" font-size="12.5" fill="#374151">Client</text>
  <text x="90" y="138" text-anchor="middle" font-size="9.5" fill="#6B7280">(pod ou externe)</text>

  <line x1="165" y1="125" x2="248" y2="125" stroke="#6B7280" stroke-width="1.5" marker-end="url(#svcArrow)"/>

  <!-- Service -->
  <rect x="250" y="90" width="160" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="330" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Service</text>
  <text x="330" y="132" text-anchor="middle" font-size="9.5" fill="#3B5FA0">ClusterIP</text>
  <text x="330" y="146" text-anchor="middle" font-size="9.5" fill="#3B5FA0">10.96.x.x</text>

  <!-- fan to pods -->
  <line x1="410" y1="125" x2="478" y2="52" stroke="#2563EB" stroke-width="1.5" marker-end="url(#svcArrow)"/>
  <line x1="410" y1="125" x2="478" y2="125" stroke="#2563EB" stroke-width="1.5" marker-end="url(#svcArrow)"/>
  <line x1="410" y1="125" x2="478" y2="198" stroke="#2563EB" stroke-width="1.5" marker-end="url(#svcArrow)"/>

  <rect x="480" y="30" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#1E3A8A">Pod api-1</text>

  <rect x="480" y="103" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="129" text-anchor="middle" font-size="12" fill="#1E3A8A">Pod api-2</text>

  <rect x="480" y="176" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="202" text-anchor="middle" font-size="12" fill="#1E3A8A">Pod api-3</text>
</svg>
