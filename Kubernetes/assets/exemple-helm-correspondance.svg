<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="472" viewBox="0 0 1000 472" role="img" aria-label="Correspondance entre values.yaml, le template Helm deployment.yaml et le manifeste Deployment rendu : nom de release, replicas, image, secret et resources, une couleur par donnée" style="font-family: Helvetica, Arial, sans-serif;">
  <title>values.yaml + template = manifeste rendu</title>

  <defs>
    <marker id="hcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="472" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">values.yaml</text>
  <text x="160" y="40" text-anchor="middle" font-size="9.5" fill="#4B5563">les valeurs : ce qui change d'un env. à l'autre</text>
  <text x="505" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">templates/deployment.yaml</text>
  <text x="505" y="40" text-anchor="middle" font-size="9.5" fill="#4B5563">la structure : des trous {{ }} à remplir</text>
  <text x="842" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Manifeste rendu</text>
  <text x="842" y="40" text-anchor="middle" font-size="9.5" fill="#4B5563">= exemple 1, reçu par l'apiserver</text>

  <!-- Row 1: release name (pink) -->
  <g font-family="Menlo, Consolas, monospace" font-size="9.5">
    <rect x="15" y="60" width="300" height="42" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="27" y="79" fill="#9D174D">$ helm install catalogue-api ./catalogue-api</text>
    <text x="27" y="93" fill="#9D174D"># → .Release.Name = catalogue-api</text>
    <rect x="345" y="60" width="320" height="42" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.3"/>
    <text x="357" y="79" fill="#9D174D">metadata:</text>
    <text x="357" y="93" fill="#9D174D">&#160;&#160;name: {{ include "catalogue-api.fullname" . }}</text>
    <rect x="700" y="60" width="285" height="42" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.3"/>
    <text x="712" y="79" fill="#9D174D">metadata:</text>
    <text x="712" y="93" fill="#9D174D">&#160;&#160;name: catalogue-api</text>
  </g>
  <line x1="315" y1="81" x2="343" y2="81" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>
  <line x1="665" y1="81" x2="698" y2="81" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>

  <!-- Row 2: replicas (blue) -->
  <g font-family="Menlo, Consolas, monospace" font-size="9.5">
    <rect x="15" y="114" width="300" height="56" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
    <text x="27" y="133" fill="#1E3A8A">replicaCount: 3</text>
    <text x="27" y="147" fill="#1E3A8A">autoscaling:</text>
    <text x="27" y="161" fill="#1E3A8A">&#160;&#160;enabled: false</text>
    <rect x="345" y="114" width="320" height="56" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
    <text x="357" y="133" fill="#1E3A8A">{{- if not .Values.autoscaling.enabled }}</text>
    <text x="357" y="147" fill="#1E3A8A">replicas: {{ .Values.replicaCount }}</text>
    <text x="357" y="161" fill="#1E3A8A">{{- end }}</text>
    <rect x="700" y="114" width="285" height="56" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
    <text x="712" y="133" fill="#1E3A8A">replicas: 3</text>
    <text x="712" y="147" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#3B5FA0">(ligne absente si autoscaling.enabled: true)</text>
  </g>
  <line x1="315" y1="142" x2="343" y2="142" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>
  <line x1="665" y1="142" x2="698" y2="142" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>

  <!-- Row 3: image (green) -->
  <g font-family="Menlo, Consolas, monospace" font-size="9.5">
    <rect x="15" y="182" width="300" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
    <text x="27" y="201" fill="#065F46">image:</text>
    <text x="27" y="215" fill="#065F46">&#160;&#160;repository: registry.example.com/catalogue-api</text>
    <text x="27" y="229" fill="#065F46">&#160;&#160;tag: ""   # vide → appVersion (2.4.1)</text>
    <rect x="345" y="182" width="320" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
    <text x="357" y="201" fill="#065F46">image: {{ include "catalogue-api.image" . }}</text>
    <text x="357" y="215" fill="#047857"># helper : repository + ":" + tag</text>
    <rect x="700" y="182" width="285" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
    <text x="712" y="201" fill="#065F46">image: registry.example.com/catalogue-api:2.4.1</text>
  </g>
  <line x1="315" y1="210" x2="343" y2="210" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>
  <line x1="665" y1="210" x2="698" y2="210" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>

  <!-- Row 4: secret (amber) -->
  <g font-family="Menlo, Consolas, monospace" font-size="9.5">
    <rect x="15" y="250" width="300" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="27" y="269" fill="#92400E">database:</text>
    <text x="27" y="283" fill="#92400E">&#160;&#160;existingSecret: catalogue-db-credentials</text>
    <rect x="345" y="250" width="320" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="357" y="269" fill="#92400E">secretKeyRef:</text>
    <text x="357" y="283" fill="#92400E">&#160;&#160;name: {{ .Values.database.existingSecret }}</text>
    <text x="357" y="297" fill="#92400E">&#160;&#160;key: password</text>
    <rect x="700" y="250" width="285" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
    <text x="712" y="269" fill="#92400E">secretKeyRef:</text>
    <text x="712" y="283" fill="#92400E">&#160;&#160;name: catalogue-db-credentials</text>
    <text x="712" y="297" fill="#92400E">&#160;&#160;key: password</text>
  </g>
  <line x1="315" y1="278" x2="343" y2="278" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>
  <line x1="665" y1="278" x2="698" y2="278" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>

  <!-- Row 5: resources (purple) -->
  <g font-family="Menlo, Consolas, monospace" font-size="9.5">
    <rect x="15" y="318" width="300" height="112" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
    <text x="27" y="337" fill="#5B21B6">resources:</text>
    <text x="27" y="351" fill="#5B21B6">&#160;&#160;requests:</text>
    <text x="27" y="365" fill="#5B21B6">&#160;&#160;&#160;&#160;cpu: 250m</text>
    <text x="27" y="379" fill="#5B21B6">&#160;&#160;&#160;&#160;memory: 256Mi</text>
    <text x="27" y="393" fill="#5B21B6">&#160;&#160;limits:</text>
    <text x="27" y="407" fill="#5B21B6">&#160;&#160;&#160;&#160;cpu: 500m</text>
    <text x="27" y="421" fill="#5B21B6">&#160;&#160;&#160;&#160;memory: 512Mi</text>
    <rect x="345" y="318" width="320" height="112" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
    <text x="357" y="337" fill="#5B21B6">resources:</text>
    <text x="357" y="351" fill="#5B21B6">&#160;&#160;{{- toYaml .Values.resources | nindent 12 }}</text>
    <text x="357" y="379" fill="#6D28D9"># toYaml recopie tout le bloc,</text>
    <text x="357" y="393" fill="#6D28D9"># nindent le réindente sous resources:</text>
    <rect x="700" y="318" width="285" height="112" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
    <text x="712" y="337" fill="#5B21B6">resources:</text>
    <text x="712" y="351" fill="#5B21B6">&#160;&#160;limits:</text>
    <text x="712" y="365" fill="#5B21B6">&#160;&#160;&#160;&#160;cpu: 500m</text>
    <text x="712" y="379" fill="#5B21B6">&#160;&#160;&#160;&#160;memory: 512Mi</text>
    <text x="712" y="393" fill="#5B21B6">&#160;&#160;requests:</text>
    <text x="712" y="407" fill="#5B21B6">&#160;&#160;&#160;&#160;cpu: 250m</text>
    <text x="712" y="421" fill="#5B21B6">&#160;&#160;&#160;&#160;memory: 256Mi</text>
  </g>
  <line x1="315" y1="374" x2="343" y2="374" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>
  <line x1="665" y1="374" x2="698" y2="374" stroke="#374151" stroke-width="1.4" marker-end="url(#hcArrow)"/>

  <!-- Badges -->
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="15" cy="60" r="9" fill="#DB2777"/><text x="15" y="64">1</text>
    <circle cx="15" cy="114" r="9" fill="#2563EB"/><text x="15" y="118">2</text>
    <circle cx="15" cy="182" r="9" fill="#059669"/><text x="15" y="186">3</text>
    <circle cx="15" cy="250" r="9" fill="#D97706"/><text x="15" y="254">4</text>
    <circle cx="15" cy="318" r="9" fill="#7C3AED"/><text x="15" y="322">5</text>
  </g>

  <text x="500" y="455" text-anchor="middle" font-size="10" fill="#4B5563">Même couleur = même donnée. Tout ce qui n'apparaît pas dans values.yaml est écrit en dur dans le template.</text>
</svg>
