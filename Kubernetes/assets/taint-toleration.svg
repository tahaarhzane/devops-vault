<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" role="img" aria-label="Un nœud avec taint repousse un pod sans toleration mais accepte un pod avec toleration" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Taint et toleration : un pod sans toleration est repoussé, un pod avec toleration est accepté</title>

  <defs>
    <marker id="tArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="tBlockBar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="10" orient="auto-start-reverse">
      <line x1="5" y1="0" x2="5" y2="10" stroke="#DC2626" stroke-width="2"/>
    </marker>
    <g id="icoServerT" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="12" height="16" rx="1.5"/>
      <line x1="6" y1="7" x2="14" y2="7"/>
      <line x1="6" y1="11" x2="14" y2="11"/>
      <line x1="6" y1="15" x2="14" y2="15"/>
    </g>
    <g id="icoCubeT" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="10,2 16.93,6 16.93,14 10,18 3.07,14 3.07,6"/>
      <line x1="10" y1="10" x2="10" y2="2"/>
      <line x1="10" y1="10" x2="16.93" y2="14"/>
      <line x1="10" y1="10" x2="3.07" y2="14"/>
    </g>
  </defs>

  <rect x="0" y="0" width="620" height="240" fill="#ffffff"/>

  <!-- Node -->
  <rect x="30" y="80" width="180" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <use href="#icoServerT" transform="translate(42,93) scale(0.8)" stroke="#92400E"/>
  <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Nœud</text>
  <text x="120" y="126" text-anchor="middle" font-size="9.5" fill="#92400E">taint: key=gpu:NoSchedule</text>

  <!-- repousse -->
  <polyline points="210,100 300,100 370,58" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#tBlockBar)"/>
  <text x="275" y="78" text-anchor="middle" font-size="9" fill="#991B1B">repousse (NoSchedule)</text>

  <rect x="380" y="30" width="200" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <use href="#icoCubeT" transform="translate(392,43) scale(0.7)" stroke="#991B1B"/>
  <text x="480" y="59" text-anchor="middle" font-size="12" fill="#991B1B">Pod sans toleration</text>

  <!-- accepte -->
  <line x1="210" y1="120" x2="378" y2="172" stroke="#059669" stroke-width="1.5" marker-end="url(#tArrowGreen)"/>
  <text x="290" y="125" text-anchor="middle" font-size="9" fill="#065F46">accepte (toleration)</text>

  <rect x="380" y="150" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <use href="#icoCubeT" transform="translate(392,157) scale(0.7)" stroke="#065F46"/>
  <text x="480" y="172" text-anchor="middle" font-size="12" fill="#065F46">Pod avec toleration</text>
  <text x="480" y="188" text-anchor="middle" font-size="10" fill="#065F46">key=gpu</text>
</svg>
