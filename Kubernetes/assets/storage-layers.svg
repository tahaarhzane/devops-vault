<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="Un Pod monte un PVC qui est lié à un PV, provisionné par une StorageClass" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Couches de stockage : Pod, PVC, PV, StorageClass</title>

  <defs>
    <marker id="stArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="200" fill="#ffffff"/>

  <!-- StorageClass -->
  <rect x="480" y="16" width="180" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="570" y="38" text-anchor="middle" font-size="12" fill="#374151">StorageClass</text>
  <text x="570" y="54" text-anchor="middle" font-size="9.5" fill="#6B7280">(profil de stockage)</text>

  <line x1="570" y1="72" x2="570" y2="104" stroke="#6B7280" stroke-width="1.5" marker-end="url(#stArrow)"/>
  <text x="584" y="92" text-anchor="start" font-size="9" fill="#4B5563">provisionne</text>

  <!-- Pod -->
  <rect x="20" y="106" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="141" text-anchor="middle" font-size="13" fill="#1E3A8A">Pod</text>

  <line x1="160" y1="136" x2="228" y2="136" stroke="#2563EB" stroke-width="1.5" marker-end="url(#stArrow)"/>
  <text x="194" y="156" text-anchor="middle" font-size="9.5" fill="#1E3A8A">monte</text>

  <!-- PVC -->
  <rect x="230" y="106" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#1E3A8A">PersistentVolumeClaim</text>
  <text x="320" y="147" text-anchor="middle" font-size="9.5" fill="#1E3A8A">(demande d'un pod)</text>

  <line x1="410" y1="136" x2="478" y2="136" stroke="#2563EB" stroke-width="1.5" marker-end="url(#stArrow)"/>
  <text x="444" y="156" text-anchor="middle" font-size="9.5" fill="#1E3A8A">bind</text>

  <!-- PV -->
  <rect x="480" y="106" width="180" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="570" y="130" text-anchor="middle" font-size="11.5" fill="#1E3A8A">PersistentVolume</text>
  <text x="570" y="147" text-anchor="middle" font-size="9.5" fill="#1E3A8A">(disque réel)</text>
</svg>
