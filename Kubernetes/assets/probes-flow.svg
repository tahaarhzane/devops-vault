<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-label="Arbre de décision des probes : startupProbe, livenessProbe, readinessProbe" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Startup, liveness et readiness probes : ce qui se passe à chaque échec</title>

  <defs>
    <marker id="prArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="prArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="prArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="prArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <!-- Start -->
  <rect x="280" y="10" width="200" height="40" rx="20" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="380" y="35" text-anchor="middle" font-size="11" fill="#374151">Démarrage du conteneur</text>
  <line x1="380" y1="50" x2="380" y2="83" stroke="#6B7280" stroke-width="1.5" marker-end="url(#prArrowGray)"/>

  <!-- startupProbe diamond -->
  <polygon points="380,85 470,120 380,155 290,120" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="380" y="124" text-anchor="middle" font-size="10.5" fill="#1E3A8A">startupProbe</text>

  <!-- échec -> tué -->
  <line x1="288" y1="120" x2="232" y2="120" stroke="#DC2626" stroke-width="1.5" marker-end="url(#prArrowRed)"/>
  <text x="260" y="108" text-anchor="middle" font-size="9" fill="#991B1B">échec répété</text>
  <rect x="50" y="95" width="180" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#991B1B">Conteneur tué</text>
  <text x="140" y="132" text-anchor="middle" font-size="9.5" fill="#991B1B">(restartPolicy)</text>

  <!-- succès -> en fonctionnement -->
  <line x1="380" y1="157" x2="380" y2="198" stroke="#059669" stroke-width="1.5" marker-end="url(#prArrowGreen)"/>
  <text x="398" y="180" text-anchor="start" font-size="9" fill="#065F46">succès</text>
  <rect x="280" y="200" width="200" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="227" text-anchor="middle" font-size="12" fill="#065F46">En fonctionnement</text>

  <!-- fan to liveness / readiness -->
  <line x1="380" y1="244" x2="235" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#prArrowGray)"/>
  <line x1="380" y1="244" x2="525" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#prArrowGray)"/>

  <!-- livenessProbe diamond -->
  <polygon points="230,265 320,300 230,335 140,300" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="296" text-anchor="middle" font-size="10" fill="#1E3A8A">livenessProbe</text>
  <text x="230" y="309" text-anchor="middle" font-size="9" fill="#1E3A8A">(en continu)</text>

  <!-- readinessProbe diamond -->
  <polygon points="530,265 620,300 530,335 440,300" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="530" y="296" text-anchor="middle" font-size="10" fill="#1E3A8A">readinessProbe</text>
  <text x="530" y="309" text-anchor="middle" font-size="9" fill="#1E3A8A">(en continu)</text>

  <!-- liveness échec -->
  <line x1="230" y1="337" x2="230" y2="378" stroke="#D97706" stroke-width="1.5" marker-end="url(#prArrowAmber)"/>
  <text x="248" y="360" text-anchor="start" font-size="9" fill="#92400E">échec</text>
  <rect x="140" y="380" width="180" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="230" y="410" text-anchor="middle" font-size="11.5" fill="#92400E">Conteneur redémarré</text>

  <!-- readiness échec -->
  <line x1="530" y1="337" x2="530" y2="378" stroke="#D97706" stroke-width="1.5" marker-end="url(#prArrowAmber)"/>
  <text x="548" y="360" text-anchor="start" font-size="9" fill="#92400E">échec</text>
  <rect x="440" y="380" width="180" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="530" y="401" text-anchor="middle" font-size="10.5" fill="#92400E">Retiré des Endpoints</text>
  <text x="530" y="416" text-anchor="middle" font-size="10.5" fill="#92400E">du Service</text>

  <!-- readiness succès -->
  <line x1="618" y1="300" x2="658" y2="300" stroke="#059669" stroke-width="1.5" marker-end="url(#prArrowGreen)"/>
  <text x="638" y="288" text-anchor="middle" font-size="9" fill="#065F46">succès</text>
  <rect x="660" y="275" width="150" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="735" y="305" text-anchor="middle" font-size="11.5" fill="#065F46">Reçoit du trafic</text>
</svg>
