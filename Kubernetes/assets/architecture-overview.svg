<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-label="Vue d'ensemble : control plane et deux worker nodes" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Vue d'ensemble Kubernetes : control plane et worker nodes</title>

  <defs>
    <marker id="arrowGray2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="510" fill="#ffffff"/>

  <!-- Client -->
  <rect x="32" y="12" width="160" height="34" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="112" y="33" text-anchor="middle" font-size="11.5" fill="#374151">kubectl / client</text>
  <line x1="112" y1="46" x2="112" y2="64" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray2)"/>

  <!-- Control plane single box -->
  <rect x="30" y="64" width="860" height="92" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="460" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Control Plane</text>
  <text x="460" y="122" text-anchor="middle" font-size="11" fill="#3B5FA0">apiserver · etcd · scheduler · controller-manager · cloud-controller-manager</text>
  <text x="460" y="140" text-anchor="middle" font-size="9.5" fill="#6B85C4">(détail des interactions : schéma suivant)</text>

  <!-- apiserver <-> kubelet node 1 -->
  <line x1="135" y1="156" x2="135" y2="228" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray2)" marker-start="url(#arrowGray2)"/>
  <text x="145" y="176" text-anchor="start" font-size="9.5" fill="#4B5563">watch /</text>
  <text x="145" y="187" text-anchor="start" font-size="9.5" fill="#4B5563">status</text>

  <!-- apiserver <-> kubelet node 2 -->
  <line x1="575" y1="156" x2="575" y2="228" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowGray2)" marker-start="url(#arrowGray2)"/>
  <text x="585" y="176" text-anchor="start" font-size="9.5" fill="#4B5563">watch /</text>
  <text x="585" y="187" text-anchor="start" font-size="9.5" fill="#4B5563">status</text>

  <!-- ===== Node 1 ===== -->
  <rect x="30" y="190" width="420" height="284" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="46" y="212" font-size="13" font-weight="700" fill="#065F46">Worker Node</text>

  <rect x="50" y="228" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="135" y="254" text-anchor="middle" font-size="12" fill="#065F46">kubelet</text>

  <rect x="250" y="228" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="335" y="254" text-anchor="middle" font-size="12" fill="#065F46">kube-proxy</text>

  <rect x="50" y="286" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="135" y="312" text-anchor="middle" font-size="12" fill="#065F46">Container runtime</text>

  <line x1="135" y1="270" x2="135" y2="284" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="160" y="281" font-size="9" fill="#065F46">démarre</text>

  <rect x="50" y="344" width="370" height="110" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="64" y="364" font-size="12" font-weight="700" fill="#065F46">Pods</text>

  <rect x="64" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="116" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>
  <rect x="184" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="236" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>
  <rect x="304" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="356" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>

  <line x1="135" y1="328" x2="135" y2="342" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="150" y="339" font-size="9" fill="#065F46">exécute</text>

  <line x1="335" y1="270" x2="335" y2="342" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray2)"/>
  <text x="345" y="310" text-anchor="start" font-size="9" fill="#4B5563">règles</text>
  <text x="345" y="321" text-anchor="start" font-size="9" fill="#4B5563">réseau</text>

  <!-- ===== Node 2 ===== -->
  <rect x="470" y="190" width="420" height="284" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  <text x="486" y="212" font-size="13" font-weight="700" fill="#065F46">Worker Node</text>

  <rect x="490" y="228" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="254" text-anchor="middle" font-size="12" fill="#065F46">kubelet</text>

  <rect x="690" y="228" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="775" y="254" text-anchor="middle" font-size="12" fill="#065F46">kube-proxy</text>

  <rect x="490" y="286" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="312" text-anchor="middle" font-size="12" fill="#065F46">Container runtime</text>

  <line x1="575" y1="270" x2="575" y2="284" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="600" y="281" font-size="9" fill="#065F46">démarre</text>

  <rect x="490" y="344" width="370" height="110" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="504" y="364" font-size="12" font-weight="700" fill="#065F46">Pods</text>

  <rect x="504" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="556" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>
  <rect x="624" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="676" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>
  <rect x="744" y="376" width="104" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="796" y="408" text-anchor="middle" font-size="11.5" fill="#065F46">Pod</text>

  <line x1="575" y1="328" x2="575" y2="342" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="590" y="339" font-size="9" fill="#065F46">exécute</text>

  <line x1="775" y1="270" x2="775" y2="342" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray2)"/>
  <text x="785" y="310" text-anchor="start" font-size="9" fill="#4B5563">règles</text>
  <text x="785" y="321" text-anchor="start" font-size="9" fill="#4B5563">réseau</text>
</svg>
