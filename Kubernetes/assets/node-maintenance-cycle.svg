<svg xmlns="http://www.w3.org/2000/svg" width="930" height="210" viewBox="0 0 930 210" role="img" aria-label="Cycle de maintenance d'un nœud : cordon, drain, maintenance, uncordon" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Cycle cordon → drain → maintenance → uncordon</title>

  <defs>
    <marker id="nArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <g id="icoServerN" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="12" height="16" rx="1.5"/>
      <line x1="6" y1="7" x2="14" y2="7"/>
      <line x1="6" y1="11" x2="14" y2="11"/>
      <line x1="6" y1="15" x2="14" y2="15"/>
    </g>
  </defs>

  <rect x="0" y="0" width="930" height="210" fill="#ffffff"/>

  <!-- return arrow (uncordon) -->
  <path d="M835,110 C835,20 100,20 100,108" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#nArrow)"/>
  <text x="467" y="33" text-anchor="middle" font-size="10" fill="#1E3A8A">kubectl uncordon</text>

  <!-- boxes -->
  <rect x="20" y="110" width="160" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <use href="#icoServerN" transform="translate(32,123) scale(0.8)" stroke="#065F46"/>
  <text x="100" y="136" text-anchor="middle" font-size="11.5" fill="#065F46">Nœud actif</text>
  <text x="100" y="152" text-anchor="middle" font-size="10" fill="#065F46">(schedulable)</text>

  <rect x="250" y="110" width="190" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <use href="#icoServerN" transform="translate(262,123) scale(0.8)" stroke="#92400E"/>
  <text x="345" y="136" text-anchor="middle" font-size="11.5" fill="#92400E">Nœud cordonné</text>
  <text x="345" y="152" text-anchor="middle" font-size="9.5" fill="#92400E">(pas de nouveaux pods)</text>

  <rect x="510" y="110" width="180" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <use href="#icoServerN" transform="translate(522,123) scale(0.8)" stroke="#92400E"/>
  <text x="600" y="136" text-anchor="middle" font-size="11.5" fill="#92400E">Pods évacués</text>
  <text x="600" y="152" text-anchor="middle" font-size="9.5" fill="#92400E">vers d'autres nœuds</text>

  <rect x="760" y="110" width="150" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <use href="#icoServerN" transform="translate(772,131) scale(0.7)" stroke="#374151"/>
  <text x="835" y="145" text-anchor="middle" font-size="11.5" fill="#374151">Nœud maintenu</text>

  <!-- forward arrows -->
  <line x1="180" y1="140" x2="248" y2="140" stroke="#2563EB" stroke-width="1.5" marker-end="url(#nArrow)"/>
  <line x1="440" y1="140" x2="508" y2="140" stroke="#2563EB" stroke-width="1.5" marker-end="url(#nArrow)"/>
  <line x1="690" y1="140" x2="758" y2="140" stroke="#2563EB" stroke-width="1.5" marker-end="url(#nArrow)"/>

  <text x="214" y="190" text-anchor="middle" font-size="9.5" fill="#1E3A8A">kubectl cordon</text>
  <text x="474" y="190" text-anchor="middle" font-size="9.5" fill="#1E3A8A">kubectl drain</text>
  <text x="724" y="190" text-anchor="middle" font-size="9.5" fill="#1E3A8A">maintenance OS/kernel</text>
</svg>
