<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="Cycle de vie d'un pod : Pending, Running, puis Succeeded ou Failed" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Cycle de vie d'un pod</title>

  <defs>
    <marker id="pArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="pArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="pArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="pArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="300" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="28" cy="150" r="7" fill="#374151"/>
  <line x1="35" y1="150" x2="68" y2="150" stroke="#6B7280" stroke-width="1.5" marker-end="url(#pArrowGray)"/>

  <!-- Pending -->
  <rect x="70" y="128" width="104" height="44" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="122" y="154" text-anchor="middle" font-size="12.5" fill="#374151">Pending</text>

  <line x1="174" y1="150" x2="248" y2="150" stroke="#6B7280" stroke-width="1.5" marker-end="url(#pArrowGray)"/>
  <text x="211" y="190" text-anchor="middle" font-size="9" fill="#4B5563">conteneurs démarrés</text>

  <!-- Running -->
  <rect x="250" y="128" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="305" y="154" text-anchor="middle" font-size="12.5" fill="#1E3A8A">Running</text>

  <!-- self-loop restart -->
  <path d="M275,128 C275,98 335,98 335,128" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#pArrowBlue)"/>
  <text x="305" y="90" text-anchor="middle" font-size="9" fill="#1E3A8A">redémarre (restartPolicy)</text>

  <!-- branch to Succeeded -->
  <polyline points="360,140 420,140 420,72 520,72" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#pArrowGreen)"/>
  <text x="430" y="105" text-anchor="start" font-size="9" fill="#065F46">tous les conteneurs</text>
  <text x="430" y="116" text-anchor="start" font-size="9" fill="#065F46">terminés (exit 0)</text>

  <!-- branch to Failed -->
  <polyline points="360,160 420,160 420,228 520,228" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#pArrowRed)"/>
  <text x="430" y="196" text-anchor="start" font-size="9" fill="#991B1B">au moins un conteneur</text>
  <text x="430" y="207" text-anchor="start" font-size="9" fill="#991B1B">en erreur</text>

  <!-- Succeeded -->
  <rect x="520" y="50" width="140" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="590" y="76" text-anchor="middle" font-size="12.5" fill="#065F46">Succeeded</text>
  <line x1="660" y1="72" x2="692" y2="72" stroke="#059669" stroke-width="1.5" marker-end="url(#pArrowGreen)"/>
  <circle cx="705" cy="72" r="9" fill="none" stroke="#374151" stroke-width="1.5"/>
  <circle cx="705" cy="72" r="4" fill="#374151"/>

  <!-- Failed -->
  <rect x="520" y="206" width="140" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="590" y="232" text-anchor="middle" font-size="12.5" fill="#991B1B">Failed</text>
  <line x1="660" y1="228" x2="692" y2="228" stroke="#DC2626" stroke-width="1.5" marker-end="url(#pArrowRed)"/>
  <circle cx="705" cy="228" r="9" fill="none" stroke="#374151" stroke-width="1.5"/>
  <circle cx="705" cy="228" r="4" fill="#374151"/>
</svg>
