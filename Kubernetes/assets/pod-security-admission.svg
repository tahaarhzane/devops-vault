<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Un namespace en Pod Security Admission restricted rejette un pod privileged mais accepte un pod conforme" style="font-family: Helvetica, Arial, sans-serif;">
  <title>Pod Security Admission : un pod privilégié est rejeté, un pod conforme est accepté</title>

  <defs>
    <marker id="psArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="psBlockBar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="10" orient="auto-start-reverse">
      <line x1="5" y1="0" x2="5" y2="10" stroke="#DC2626" stroke-width="2"/>
    </marker>
    <g id="icoShieldPS" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10,2 L17,5 V10 C17,14.5 14,17.5 10,19 C6,17.5 3,14.5 3,10 V5 Z"/>
    </g>
    <g id="icoCubePS" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="10,2 16.93,6 16.93,14 10,18 3.07,14 3.07,6"/>
      <line x1="10" y1="10" x2="10" y2="2"/>
      <line x1="10" y1="10" x2="16.93" y2="14"/>
      <line x1="10" y1="10" x2="3.07" y2="14"/>
    </g>
  </defs>

  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>

  <!-- Namespace -->
  <rect x="20" y="80" width="200" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <use href="#icoShieldPS" transform="translate(32,93) scale(0.8)" stroke="#1E3A8A"/>
  <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Namespace</text>
  <text x="130" y="126" text-anchor="middle" font-size="8.5" fill="#1E3A8A">pod-security.kubernetes.io/</text>
  <text x="130" y="138" text-anchor="middle" font-size="8.5" fill="#1E3A8A">enforce: restricted</text>

  <!-- rejette -->
  <polyline points="220,100 310,100 380,58" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#psBlockBar)"/>
  <text x="285" y="78" text-anchor="middle" font-size="9" fill="#991B1B">rejeté (admission)</text>

  <rect x="390" y="30" width="220" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <use href="#icoCubePS" transform="translate(402,43) scale(0.7)" stroke="#991B1B"/>
  <text x="500" y="59" text-anchor="middle" font-size="11.5" fill="#991B1B">Pod privileged: true</text>

  <!-- accepte -->
  <line x1="220" y1="120" x2="388" y2="172" stroke="#059669" stroke-width="1.5" marker-end="url(#psArrowGreen)"/>
  <text x="300" y="125" text-anchor="middle" font-size="9" fill="#065F46">accepté</text>

  <rect x="390" y="150" width="220" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <use href="#icoCubePS" transform="translate(402,157) scale(0.7)" stroke="#065F46"/>
  <text x="500" y="172" text-anchor="middle" font-size="11.5" fill="#065F46">Pod conforme (restricted)</text>
  <text x="500" y="188" text-anchor="middle" font-size="9.5" fill="#065F46">runAsNonRoot, capabilities: drop ALL</text>
</svg>
